name: Release

# Al pushear un tag vX.Y.Z: tests, APK release firmado y un GitHub Release con el APK.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # La keystore vive en los secrets del repo (base64), nunca en git.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XLINK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret XLINK_KEYSTORE_BASE64 (keystore en base64)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "XLINK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests y APK release
        env:
          XLINK_KEYSTORE_PASSWORD: ${{ secrets.XLINK_KEYSTORE_PASSWORD }}
          XLINK_KEY_ALIAS: ${{ secrets.XLINK_KEY_ALIAS }}
          XLINK_KEY_PASSWORD: ${{ secrets.XLINK_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "XLink-DSP-${GITHUB_REF_NAME}.apk"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: XLink-DSP-${{ github.ref_name }}.apk
          generate_release_notes: true
