name: Tests

# PR contra main (y lo que entra a main): tests + build debug, lo más rápido posible.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo a la misma PR cancela la corrida vieja (ahorra minutos).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cachea Gradle entre corridas; las PR solo leen la caché.
      - uses: gradle/actions/setup-gradle@v4

      # Los tests de dsp fijan los strings exactos que recibe el DSP.
      - name: Tests y build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Resultados de los tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
